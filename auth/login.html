<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Workout Hub 2.0</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="glass animate" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo" style="font-size: 2rem; margin-bottom: 0.5rem;">WORKOUT<span
                    style="color: var(--primary)">HUB</span></div>
            <p style="color: var(--text-muted);">Welcome back! Please login.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; margin-top: 1rem;">
                Sign In
            </button>
        </form>

        <p style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
            Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
        </p>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.8rem;">
            <a href="../index.html" style="color: var(--text-muted); text-decoration: none;">← Back to Home</a>
        </p>
    </div>

    <script src="../js/api-helper.js"></script>
    <script>
        // Adjust endpoint for auth folder
        window.API_ENDPOINT = '../backend/api.php';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Signing in...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await apiRequest('login', 'POST', { email, password });

            if (result && result.status === 'success') {
                localStorage.setItem('auth_token', result.token);
                window.location.href = result.role === 'admin' ? '../admin-dashboard.html' : '../dashboard.html';
            } else {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        });
    </script>
</body>

</html>
