<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Workout Hub 2.0</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass animate" style="width: 100%; max-width: 500px; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo" style="font-size: 2rem; margin-bottom: 0.5rem;">WORKOUT<span
                    style="color: var(--primary)">HUB</span></div>
            <p style="color: var(--text-muted);">Start your fitness journey today.</p>
        </div>

        <form id="signupForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" class="form-input" style="background: var(--bg-card);">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="mno" class="form-input" placeholder="+1 234 567 890">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                <small style="color: var(--text-muted); font-size: 0.75rem;">Minimum 6 characters.</small>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; margin-top: 1rem;">
                Create Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Log in</a>
        </p>
    </div>

    <script src="../js/api-helper.js"></script>
    <script>
        // Adjust endpoint for auth folder
        window.API_ENDPOINT = '../backend/api.php';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Creating account...';

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                dob: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
                mno: document.getElementById('mno').value,
                password: document.getElementById('password').value
            };

            const result = await apiRequest('register', 'POST', data);

            if (result && result.status === 'success') {
                showToast('Registration successful! Please login.', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        });
    </script>
</body>

</html>
