<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Workout Hub 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="glass">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo">WORKOUT<span style="color: var(--primary)">HUB</span> (Admin)</div>
            <ul class="nav-links">
                <li><a href="index.html">View Site</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="margin-top: 4rem; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
        <!-- Add Exercise Form -->
        <section class="glass animate" style="padding: 2rem;">
            <h3 style="margin-bottom: 2rem;">Add New Exercise</h3>
            <form id="addExerciseForm">
                <input type="hidden" name="action" value="add_exercise">
                <div class="form-group">
                    <label>Exercise Name</label>
                    <input type="text" name="name" class="form-input" placeholder="e.g. Bench Press" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-input" style="height: 100px; resize: none;"
                        required></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Muscle Group</label>
                        <select name="muscle_group" class="form-input" style="background: var(--bg-dark);">
                            <option>Chest</option>
                            <option>Back</option>
                            <option>Legs</option>
                            <option>Shoulders</option>
                            <option>Core</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select name="difficulty" class="form-input" style="background: var(--bg-dark);">
                            <option>Beginner</option>
                            <option>Intermediate</option>
                            <option>Advanced</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Video URL (YouTube/Embed)</label>
                    <input type="url" name="video_url" class="form-input" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" name="image_url" class="form-input" placeholder="https://...">
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center; margin-top: 1rem;">
                    Upload Exercise
                </button>
            </form>
        </section>

        <!-- Stats / List Overview -->
        <section>
            <div class="glass animate" style="padding: 2rem; margin-bottom: 2rem;">
                <h3 style="margin-bottom: 1rem;">Quick Stats</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div style="text-align: center; padding: 1rem; background: var(--glass); border-radius: 12px;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">24</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Exercises</div>
                    </div>
                    <div style="text-align: center; padding: 1rem; background: var(--glass); border-radius: 12px;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: #10b981;">152</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Users</div>
                    </div>
                    <div style="text-align: center; padding: 1rem; background: var(--glass); border-radius: 12px;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);">850</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Logs</div>
                    </div>
                </div>
            </div>

            <div class="glass animate" style="padding: 2rem; animation-delay: 0.1s;">
                <h3 style="margin-bottom: 1.5rem;">Recent Uploads</h3>
                <div id="adminExerciseList" style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- List will be populated -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/api-helper.js"></script>
    <script>
        // Handle Form Submission
        document.getElementById('addExerciseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const result = await apiRequest('add_exercise', 'POST', data);
            if (result && result.status === 'success') {
                showToast('Exercise added successfully!', 'success');
                e.target.reset();
                loadRecentExercises();
            }
        });

        // Delete Exercise
        async function deleteExercise(id) {
            if (!confirm('Are you sure you want to delete this exercise?')) return;
            const result = await apiRequest('delete_exercise', 'POST', { id });
            if (result && result.status === 'success') {
                showToast('Exercise deleted');
                loadRecentExercises();
            }
        }

        // Edit Exercise
        async function editExercise(ex) {
            const newName = prompt('Enter new name:', ex.name);
            if (!newName) return;

            const result = await apiRequest('update_exercise', 'POST', {
                ...ex,
                name: newName
            });
            if (result && result.status === 'success') {
                showToast('Exercise updated');
                loadRecentExercises();
            }
        }

        // Auth Check
        async function checkAdminAuth() {
            const result = await apiRequest('check_session');
            if (!result || result.status !== 'authenticated' || result.role !== 'admin') {
                showToast('Access Denied', 'error');
                window.location.href = result && result.status === 'authenticated' ? 'dashboard.html' : 'auth/login.html';
            }
        }

        async function loadRecentExercises() {
            await checkAdminAuth();
            const exercises = await apiRequest('get_exercises');
            if (!exercises) return;

            const list = document.getElementById('adminExerciseList');
            list.innerHTML = '';

            exercises.slice(0, 10).forEach(ex => {
                const item = document.createElement('div');
                item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--glass); border-radius: 10px;';
                item.innerHTML = `
                    <div>
                        <div style="font-weight: 600;">${ex.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${ex.muscle_group} • ${ex.difficulty}</div>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn glass" style="padding: 0.5rem; border-radius: 8px;" onclick='editExercise(${JSON.stringify(ex)})'>Edit</button>
                        <button class="btn glass" style="padding: 0.5rem; border-radius: 8px; color: var(--accent);" onclick="deleteExercise(${ex.id})">Delete</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            localStorage.removeItem('auth_token');
            await apiRequest('logout', 'POST');
            window.location.href = 'auth/login.html';
        });

        loadRecentExercises();
    </script>
</body>

</html>
