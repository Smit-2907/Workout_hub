<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercises | Workout Hub 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="glass">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo">WORKOUT<span style="color: var(--primary)">HUB</span>.</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="exercises.html">Exercises</a></li>
                <li><a href="auth/login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="margin-top: 4rem;">
        <header style="margin-bottom: 3rem;">
            <h2 style="font-size: 2.5rem; margin-bottom: 1rem;">Exercise Library</h2>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search exercises..." class="form-input"
                    style="max-width: 300px;">
                <select id="muscleFilter" class="form-input" style="max-width: 200px; background: var(--bg-card);">
                    <option>All Muscle Groups</option>
                    <option>Chest</option>
                    <option>Back</option>
                    <option>Legs</option>
                    <option>Shoulders</option>
                </select>
                <select id="diffFilter" class="form-input" style="max-width: 200px; background: var(--bg-card);">
                    <option>Difficulty</option>
                    <option>Beginner</option>
                    <option>Intermediate</option>
                    <option>Advanced</option>
                </select>
            </div>
        </header>

        <div id="exerciseGrid" class="exercise-grid"
            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;">
            <!-- Dynamic Exercises will appear here -->
        </div>
    </main>

    <script>
        const muscleFilter = document.getElementById('muscleFilter');
        const diffFilter = document.getElementById('diffFilter');
        const searchInput = document.getElementById('searchInput');

        async function fetchExercises() {
            const muscle = muscleFilter.value;
            const diff = diffFilter.value;
            const search = searchInput.value.toLowerCase();

            try {
                const response = await fetch(`../backend/api.php?action=get_exercises&muscle=${muscle}&difficulty=${diff}`);
                const exercises = await response.json();

                const grid = document.getElementById('exerciseGrid');
                grid.innerHTML = '';

                if (exercises.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No exercises found.</p>';
                }

                exercises.forEach(ex => {
                    if (search && !ex.name.toLowerCase().includes(search)) return;

                    const card = document.createElement('div');
                    card.className = 'glass animate';
                    card.style.overflow = 'hidden';
                    card.style.padding = '0';

                    const imgUrl = ex.image_url || 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&q=80&w=400';
                    const muscleBadgeColor = ex.muscle_group === 'Chest' ? 'rgba(99, 102, 241, 0.2)' : 'rgba(244, 63, 94, 0.2)';
                    const muscleTextColor = ex.muscle_group === 'Chest' ? 'var(--primary)' : 'var(--accent)';

                    card.innerHTML = `
                        <div style="height: 200px; background: #334155 url('${imgUrl}') center/cover;"></div>
                        <div style="padding: 1.5rem;">
                            <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem;">
                                <span style="font-size: 0.7rem; padding: 0.2rem 0.6rem; background: ${muscleBadgeColor}; color: ${muscleTextColor}; border-radius: 20px; font-weight: 600; text-transform: uppercase;">${ex.muscle_group}</span>
                                <span style="font-size: 0.7rem; padding: 0.2rem 0.6rem; background: rgba(16, 185, 129, 0.2); color: #10b981; border-radius: 20px; font-weight: 600; text-transform: uppercase;">${ex.difficulty}</span>
                            </div>
                            <h4 style="margin-bottom: 0.5rem; font-size: 1.25rem;">${ex.name}</h4>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">${ex.description}</p>
                            <a href="exercise-detail.html?id=${ex.id}" class="btn btn-primary" style="width: 100%; justify-content: center;">View Exercise</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching exercises:', error);
            }
        }

        muscleFilter.addEventListener('change', fetchExercises);
        diffFilter.addEventListener('change', fetchExercises);
        searchInput.addEventListener('input', fetchExercises);

        // Initial fetch
        fetchExercises();
    </script>

    <footer style="margin-top: 6rem; padding: 4rem 0; text-align: center; border-top: 1px solid var(--glass-border);">
        <p style="color: var(--text-muted);">&copy; 2026 Workout Hub 2.0</p>
    </footer>
</body>

</html>
