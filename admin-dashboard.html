<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Workout Hub 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="glass">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo">WORKOUT<span style="color: var(--primary)">HUB</span> (ADMIN)</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="exercises.html">Exercises</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="margin-top: 4rem;">
        <div style="display: grid; grid-template-columns: 350px 1fr; gap: 2rem;">
            <!-- Left: Add Exercise Form -->
            <div class="glass animate" style="padding: 2rem; position: sticky; top: 6rem; height: fit-content;">
                <h3 id="formTitle" style="margin-bottom: 2rem;">Add New Exercise</h3>
                <form id="addExerciseForm">
                    <input type="hidden" id="exId">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" class="form-input" style="height: 100px; resize: none;"
                            required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Muscle Group</label>
                        <select id="muscle_group" class="form-input" style="background: var(--bg-card);">
                            <option>Chest</option>
                            <option>Back</option>
                            <option>Legs</option>
                            <option>Shoulders</option>
                            <option>Arms</option>
                            <option>Core</option>
                            <option>Cardio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select id="difficulty" class="form-input" style="background: var(--bg-card);">
                            <option>Beginner</option>
                            <option>Intermediate</option>
                            <option>Advanced</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Video URL (YouTube)</label>
                        <input type="url" id="video_url" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Image URL (Unsplash)</label>
                        <input type="url" id="image_url" class="form-input">
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary"
                        style="width: 100%; justify-content: center;">Add Exercise</button>
                    <button type="button" id="cancelBtn" class="btn glass"
                        style="width: 100%; justify-content: center; margin-top: 0.5rem; display: none;">Cancel
                        Edit</button>
                </form>
            </div>

            <!-- Right: List of Exercises -->
            <div class="glass animate" style="padding: 2rem; animation-delay: 0.1s;">
                <h3 style="margin-bottom: 2rem;">Manage Exercises</h3>
                <div id="exerciseList" style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- Rows will appear here -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/api-helper.js"></script>
    <script>
        async function checkAuth() {
            const result = await apiRequest('check_session');
            if (!result || result.role !== 'admin') {
                window.location.href = 'auth/login.html';
                return false;
            }
            return true;
        }

        async function loadExercises() {
            const authed = await checkAuth();
            if (!authed) return;

            const exercises = await apiRequest('get_exercises');
            const container = document.getElementById('exerciseList');
            container.innerHTML = '';

            if (!exercises) return;

            exercises.forEach(ex => {
                const row = document.createElement('div');
                row.className = 'glass';
                row.style.cssText = 'padding: 1rem; display: flex; justify-content: space-between; align-items: center;';
                row.innerHTML = `
                    <div>
                        <strong style="font-size: 1.1rem;">${ex.name}</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${ex.muscle_group} | ${ex.difficulty}</div>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button onclick='editExercise(${JSON.stringify(ex)})' class="btn glass" style="padding: 0.5rem 1rem;">Edit</button>
                        <button onclick="deleteExercise(${ex.id})" class="btn" style="background: rgba(244, 63, 94, 0.1); color: var(--accent); padding: 0.5rem 1rem;">Delete</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        document.getElementById('addExerciseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('exId').value;
            const action = id ? 'update_exercise' : 'add_exercise';
            const data = {
                id: id || null,
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                muscle_group: document.getElementById('muscle_group').value,
                difficulty: document.getElementById('difficulty').value,
                video_url: document.getElementById('video_url').value,
                image_url: document.getElementById('image_url').value
            };

            const result = await apiRequest(action, 'POST', data);
            if (result && result.status === 'success') {
                showToast(id ? 'Exercise updated' : 'Exercise added');
                resetForm();
                loadExercises();
            }
        });

        async function deleteExercise(id) {
            if (!confirm('Are you sure you want to delete this exercise?')) return;
            const result = await apiRequest('delete_exercise', 'POST', { id });
            if (result && result.status === 'success') {
                showToast('Exercise deleted');
                loadExercises();
            }
        }

        function editExercise(ex) {
            document.getElementById('formTitle').innerText = 'Edit Exercise';
            document.getElementById('submitBtn').innerText = 'Update Exercise';
            document.getElementById('cancelBtn').style.display = 'block';
            document.getElementById('exId').value = ex.id;
            document.getElementById('name').value = ex.name;
            document.getElementById('description').value = ex.description;
            document.getElementById('muscle_group').value = ex.muscle_group;
            document.getElementById('difficulty').value = ex.difficulty;
            document.getElementById('video_url').value = ex.video_url || '';
            document.getElementById('image_url').value = ex.image_url || '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = 'Add New Exercise';
            document.getElementById('submitBtn').innerText = 'Add Exercise';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('addExerciseForm').reset();
            document.getElementById('exId').value = '';
        }

        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            localStorage.removeItem('auth_token');
            await apiRequest('logout', 'POST');
            window.location.href = 'auth/login.html';
        });

        loadExercises();
    </script>
</body>

</html>
